<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docs Live Typer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="surface-panel">
  <div class="panel">
    <div class="segmented panel-tabs" role="tablist" aria-label="Panel sections">
      <button type="button" class="segment" role="tab" id="tab-humanizer" data-view="humanizer"
              aria-controls="view-humanizer" aria-selected="true"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 1.75l1.4 3.6 3.6 1.4-3.6 1.4L8 11.75l-1.4-3.6-3.6-1.4 3.6-1.4L8 1.75z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M12.5 11l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6.6-1.4z" fill="currentColor"/></svg>Humanizer</button>
      <button type="button" class="segment" role="tab" id="tab-typer" data-view="typer"
              aria-controls="view-typer" aria-selected="false" tabindex="-1"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.75" y="3.75" width="12.5" height="8.5" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 6.5h.01M7 6.5h.01M9.5 6.5h.01M12 6.5h.01M5 9.5h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Typer</button>
    </div>

    <section id="view-humanizer" class="view view-humanizer" role="tabpanel" aria-labelledby="tab-humanizer">
      <div class="humanize-card card">
        <div class="row-between">
          <label class="label" for="send-text">Text</label>
          <span id="send-count" class="hint">0 words</span>
        </div>
        <textarea id="send-text" class="textarea humanize-text" placeholder="Paste text, then press Humanize…" spellcheck="false"></textarea>
        <p id="send-error" class="send-error" role="alert" hidden>Paste some text first.</p>
        <p id="send-status" class="hint" aria-live="polite" hidden></p>
        <button type="button" id="humanize-btn" class="btn btn-primary btn-block">Humanize</button>
        <div class="send-actions">
          <button type="button" id="send-append" class="btn btn-secondary btn-sm" title="Add this text as the next table cell">Add as cell</button>
          <button type="button" id="send-btn" class="btn btn-secondary btn-sm" title="Send this text to the Typer as it is">Send to Typer</button>
        </div>
        <label class="inline-toggle auto-row" title="When the humanized text arrives in the Typer, start typing">
          <input type="checkbox" role="switch" class="switch" id="auto-start"> Start typing automatically
        </label>
      </div>

      <details class="site-details" id="site-details" open>
        <summary class="site-summary">
          <span>humanizeai.pro</span>
          <span class="site-state" id="site-state">Loading…</span>
        </summary>
        <div class="frame-toolbar">
          <span class="hint">Answer its cookie popup once.</span>
          <div class="frame-actions">
            <button type="button" id="frame-reload" class="btn btn-ghost btn-sm">Reload</button>
            <button type="button" id="frame-popout" class="btn btn-ghost btn-sm">Window</button>
          </div>
        </div>
      </details>

      <!-- The site is shown by default: Chrome slows down hidden pages, so a visible site humanizes faster. -->
      <div class="frame-wrap" id="frame-wrap">
        <iframe id="humanizer-frame" title="humanizeai.pro"
                allow="clipboard-read; clipboard-write"
                referrerpolicy="strict-origin-when-cross-origin"></iframe>
        <div id="frame-loading" class="frame-loading">Loading humanizeai.pro…</div>
        <div id="frame-fallback" class="frame-fallback" hidden>
          <p class="fallback-title">The humanizer did not load here.</p>
          <p class="fallback-text">Press Reload, or use the site in its own window.</p>
          <button type="button" id="fallback-open" class="btn btn-primary">Open in a window</button>
          <button type="button" id="fallback-retry" class="link-button">Try again</button>
        </div>
      </div>
    </section>

    <section id="view-typer" class="view" role="tabpanel" aria-labelledby="tab-typer" hidden>
      <div id="typer" class="typer"></div>
    </section>
  </div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
